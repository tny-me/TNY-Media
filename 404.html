<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página no encontrada — Parroquia Cristo Rey</title>
  <meta name="description" content="La página que buscas no existe. Vuelve al inicio de la Parroquia Cristo Rey."/>
  <meta name="robots" content="noindex"/>
  <link rel="icon" type="image/png" href="/assets/logo.png"/>
  <link rel="apple-touch-icon" href="/assets/logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #142b46; --gold: #b1934a; --gold2: #e3cd97;
      --cream: #f8f3e7; --ink: #1a2230; --mid: #8a8175;
    }
    body {
      font-family: 'Inter', sans-serif; font-weight: 300; color: var(--ink);
      background: var(--cream); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 24px; text-align: center;
    }
    .wrap { max-width: 560px; }
    .logo { width: 96px; margin: 0 auto 32px; display: block; }
    .code {
      font-size: 11px; font-weight: 600; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 20px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif; font-weight: 600;
      font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15;
      color: var(--navy); margin-bottom: 20px;
    }
    p { font-size: 15px; line-height: 1.9; color: var(--mid); margin-bottom: 36px; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.24em;
      text-transform: uppercase; text-decoration: none;
      color: #fff; background: var(--navy); padding: 16px 34px;
      transition: background 0.3s ease;
    }
    .btn:hover { background: var(--gold); }
    .links {
      margin-top: 44px; padding-top: 28px;
      border-top: 1px solid rgba(177,147,74,0.28);
      display: flex; flex-wrap: wrap; gap: 12px 28px; justify-content: center;
    }
    .links a {
      font-size: 11px; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; text-decoration: none; color: var(--navy);
      transition: color 0.3s ease;
    }
    .links a:hover { color: var(--gold); }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="/assets/logo.png" alt="Parroquia Cristo Rey"/>
    <div class="code">Error 404</div>
    <h1>No encontramos esta página</h1>
    <p>Es posible que el enlace haya cambiado o que la dirección esté escrita de otra forma. Te acompañamos de vuelta al inicio.</p>
    <a class="btn" href="/">Ir al inicio</a>
    <nav class="links">
      <a href="/horarios/">Horarios</a>
      <a href="/nosotros/">Nosotros</a>
      <a href="/ministerios/">Ministerios</a>
      <a href="/eventos/">Eventos</a>
      <a href="/blog/">Revista</a>
      <a href="/contacto/">Contacto</a>
    </nav>
  </main>
</body>
</html>
